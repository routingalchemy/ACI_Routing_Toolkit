# ART configuration
#
# Credentials are optional. When present they pre-fill the login form the 
# selected APIC. anything missing is typed in the app as usual.
# - "credentials" apply to every APIC
# - username/password on an APIC override it fot that APIC
# - password_env reads the password form an environmental variable instead of 
#   storing it in this file (e.g. export APIC_PASS='notapass')
# WARNING: a password in this file is stored in plain test - keep the file private
# `chmod 600` and never commit it.


settings:
  default_window_size: "1024x768"
  minimum_window_size: "1000x600"
  request_timeout: 15
  paged_timeout: 60
  token_refresh_interval: 60
  token_refresh_retry: 30
  default_token_lifetime: 600

credentials: 
  username: admin
  password: # passwd_here
  password_env: #APIC_PASS

apics:
  - name: Cisco sandbox
    url: https://sandboxapicdc.cisco.com
    verify_ssl: false
  - name: Lab 1 APIC
    url: https://apic.lab1.local
    username: admin
    password: password
    verify_ssl: false
  - name: Lab 2 APIC
    url: https://apic.lab2.local
    username: admin
    password_env: APIC_PASS
    verify_ssl: false